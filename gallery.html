<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GS Global Academy - Gallery</title>
  <style>
    main {
      max-width: 900px;
      margin: 36px auto;
      padding: 0 16px;
      flex: 1;
      text-align: center;
    }
    .slideshow-container {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      max-height: 480px;
      margin: 20px auto;
      border-radius: var(--radius);
      overflow: hidden;
      background: #111;
      box-shadow: var(--shadow);
    }
    #mainImage {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0,0,0,0.50);
      color: #fff;
      border: none;
      padding: 12px 16px;
      font-size: 20px;
      cursor: pointer;
      border-radius: 6px;
      transition: background .2s;
    }
    .nav-btn:hover { background: rgba(0,0,0,0.75); }
    #prevBtn { left: 10px; }
    #nextBtn { right: 10px; }

    .thumbnail-strip {
      display: flex;
      overflow-x: auto;
      gap: 8px;
      padding: 10px 4px;
      justify-content: flex-start;
      scrollbar-width: thin;
    }
    .thumbnail-strip img {
      width: 90px;
      height: 56px;
      object-fit: cover;
      cursor: pointer;
      opacity: .55;
      border-radius: 6px;
      flex-shrink: 0;
      transition: opacity .25s, border .25s;
      border: 2px solid transparent;
    }
    .thumbnail-strip img.active,
    .thumbnail-strip img:hover {
      opacity: 1;
      border-color: var(--primary-light);
    }
    #no-images {
      margin-top: 40px;
      color: var(--primary);
      font-weight: 600;
    }
    .image-caption {
      margin-top: 8px;
      font-size: 13px;
      color: #666;
      min-height: 20px;
    }

    /* smaller phones */
    @media (max-width: 480px) {
      .nav-btn { padding: 8px 12px; font-size: 16px; }
      .thumbnail-strip img { width: 70px; height: 44px; }
    }
  </style>
</head>
<body>

<main>
  <h1 class="page-heading">Image Gallery</h1>
  <div class="slideshow-container">
    <button id="prevBtn" class="nav-btn" aria-label="Previous">&#10094;</button>
    <img id="mainImage" src="" alt="Gallery Image">
    <button id="nextBtn" class="nav-btn" aria-label="Next">&#10095;</button>
  </div>

  <div class="thumbnail-strip" id="thumbnails"></div>
  <div id="no-images" style="display:none;">No images available.</div>
</main>

<script>
  const repoOwner = 'GSglobalschool';
  const repoName  = 'gsglobal';
  const dirPath   = 'images';

  let images = [];
  let currentIndex = 0;

  async function loadGallery() {
    const gallery  = document.getElementById('thumbnails');
    const noImages = document.getElementById('no-images');
    try {
      const apiUrl   = `https://api.github.com/repos/${repoOwner}/${repoName}/contents/${dirPath}`;
      const response = await fetch(apiUrl);
      if (!response.ok) throw new Error('Could not fetch image directory');
      const files = await response.json();

      images = files
        .filter(f => f.type === 'file' && /\.(jpe?g|png|webp|gif)$/i.test(f.name))
        .map(f => ({
          name: f.name.replace(/[-_]/g, ' ').replace(/\.[^.]+$/, ''),
          url:  f.download_url
        }));

      if (!images.length) { noImages.style.display = 'block'; return; }

      images.forEach((img, idx) => {
        const thumb    = document.createElement('img');
        thumb.src      = img.url;
        thumb.alt      = img.name;
        thumb.onclick  = () => showImage(idx);
        gallery.appendChild(thumb);
      });
      showImage(0);
    } catch (err) {
      console.error('Error loading gallery:', err);
      noImages.style.display = 'block';
    }
  }

  function showImage(index) {
    currentIndex = index;
    const mainImg = document.getElementById('mainImage');
    const thumbs  = document.getElementById('thumbnails').children;
    mainImg.src   = images[index].url;
    mainImg.alt   = images[index].name;

    for (let i = 0; i < thumbs.length; i++) {
      thumbs[i].classList.toggle('active', i === index);
    }
  }

  document.getElementById('prevBtn').addEventListener('click', () =>
    showImage((currentIndex - 1 + images.length) % images.length));
  document.getElementById('nextBtn').addEventListener('click', () =>
    showImage((currentIndex + 1) % images.length));

  // keyboard navigation
  document.addEventListener('keydown', e => {
    if (!images.length) return;
    if (e.key === 'ArrowLeft')  showImage((currentIndex - 1 + images.length) % images.length);
    if (e.key === 'ArrowRight') showImage((currentIndex + 1) % images.length);
  });

  loadGallery();
</script>
<script src="components.js"></script>
</body>
</html>
